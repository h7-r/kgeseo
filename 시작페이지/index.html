<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 피그마 디자인의 실제 제목이 정해지면 여기도 바꾼다 -->
    <title>왜곡 — 시작</title>

    <!-- 피그마 변수 font family/Font 1~3 가 부르는 글꼴 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Syncopate:wght@400;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 한글 — 피그마 변수엔 없다. 원본에 가장 가까운 Pretendard 로 둔다. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- 에러 수집기 — 본편 index.html 과 같은 장치.
         잡히지 않은 에러를 탭 제목에 찍고 window.__E 에 쌓아 둔다. -->
    <script>
      window.__E = [];
      function __err(m) {
        window.__E.push(String(m).slice(0, 500));
        document.title = "ERR: " + String(m).slice(0, 120);
      }
      addEventListener("error", (e) => __err((e.error && e.error.stack) || e.message));
      addEventListener("unhandledrejection", (e) =>
        __err("REJ " + ((e.reason && e.reason.stack) || e.reason)),
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
