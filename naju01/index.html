<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAJU-01 그레이박스</title>
  </head>
  <body>
    <!-- 본편에서 텔레포트로 넘어온 경우 — 로딩 영상(src/transition/LoadingVideoOverlay.tsx)이 뜨기 전 한순간도
         밝은 바탕이 비치지 않게, 이어받을 장면이 있으면 바탕부터 영상 막과 같은 색으로 칠해 둔다. -->
    <script>try { if (sessionStorage.getItem("kgeseo.loading.handoff.v2")) document.documentElement.style.background = "#01040a"; } catch (e) {}</script>
    <div id="root"></div>
    <!-- 에러 수집기 — 본편 index.html 과 같은 장치.
         잡히지 않은 에러를 탭 제목에 찍고 window.__E 에 쌓아 둔다. -->
    <script>
      window.__E = [];
      function __err(m) {
        window.__E.push(String(m).slice(0, 500));
        document.title = "ERR: " + String(m).slice(0, 120);
      }
      addEventListener("error", (e) => __err((e.error && e.error.stack) || e.message));
      addEventListener("unhandledrejection", (e) =>
        __err("REJ " + ((e.reason && e.reason.stack) || e.reason)),
      );
    </script>
    <!-- 기본 화면 = 공개 3D 교체판(?aihub&src=sf&r=15, 10/15 미르: 옛 화면은 쓰지 않음).
         주소에 aihub 가 없으면 붙여 준다. 옛 화면은 ?원본(또는 ?legacy), 검수 실행(?review=1)은 손대지 않는다.
         모듈들이 불러올 때 location.search 를 읽으므로 main.tsx 보다 먼저 돌아야 한다. -->
    <script>
      try {
        var __q = new URLSearchParams(location.search);
        if (!__q.has("review") && !__q.has("aihub") && !__q.has("원본") && !__q.has("legacy")) {
          var __rest = location.search.replace(/^\?/, "");
          history.replaceState(null, "", location.pathname + "?aihub&src=sf&r=15" + (__rest ? "&" + __rest : "") + location.hash);
        }
      } catch (e) {}
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
