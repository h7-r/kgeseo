<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 탭 제목 — 서비스 이름(웹사이트 website/src/navigation/routes.ts SERVICE_NAME 과 같다). 저장소 이름(kgeseo)을 쓰지 않는다 -->
    <title>ESCAPE THE LEGEND</title>
    <!-- 게임 위 UI 글꼴. 웹사이트와 같은 벌이고, 못 받아도 게임은 기본 글꼴로 돈다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
    />
    <!-- 휴대폰 세로 안내(리액트가 뜨기 전 첫 화면) — 뜨고 나면 LandscapeGuard 가 같은 안내를 맡는다(src/engine/input/LandscapeGuard.tsx).
         #root 안에 두어 리액트가 처음 그릴 때 저절로 지워진다. -->
    <style>
      #boot-rotate { display: none; }
      @media (pointer: coarse) and (orientation: portrait) {
        #boot-rotate {
          position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 12px; background: #01040a; color: #f2eee4; font-family: sans-serif; text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- 웹사이트에서 전환 영상과 함께 넘어온 경우(?transition=) — 스크립트가 뜨기 전 한순간도 밝은 바탕이 비치지 않게
         바탕부터 영상 막과 같은 색으로 칠해 둔다(naju01/src/transition/LoadingVideoOverlay.tsx). -->
    <script>try { if (new URLSearchParams(location.search).has("transition")) document.documentElement.style.background = "#01040a"; } catch (e) {}</script>
    <div id="root"><div id="boot-rotate" role="alertdialog" aria-label="가로로 돌려 주세요"><div style="font-size: 56px; line-height: 1" aria-hidden="true">⟲</div><div style="font-size: 24px; font-weight: 700">가로로 돌려 주세요</div><div style="font-size: 15px; opacity: 0.75">이 게임은 가로 화면에서 플레이합니다.</div></div></div>
    <!-- 에러 수집기 — 브라우저 콘솔을 못 볼 때(팀원 PC 등) 원인을 남긴다.
         잡히지 않은 에러를 탭 제목에 찍고 window.__E 에 쌓아 둔다. -->
    <script>
      window.__E = [];
      function __err(m) {
        window.__E.push(String(m).slice(0, 500));
        document.title = "ERR: " + String(m).slice(0, 120);
      }
      addEventListener("error", (e) => __err((e.error && e.error.stack) || e.message));
      addEventListener("unhandledrejection", (e) =>
        __err("REJ " + ((e.reason && e.reason.stack) || e.reason)),
      );
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
