// ── 발견 연출 v0(10/22 미르) — 만지면 물건이 반응하고 → 단서 물건이 눈에 보이고 → 집어서 읽고 → 조사수첩에.

function groupRoots(g){const out=new Set();if(!cur)return [];cur.traverse(o=>{if(!o.isMesh||o.userData.hull||G(o)!==g)return;let n=o;while(n.parent&&n.parent!==cur&&G(n.parent)===g)n=n.parent;out.add(n)});return [...out]}

// 물건 반응 — 플레이어 반대쪽 모서리를 축으로(들추기·열기), 반대쪽으로(밀기), 제자리(뒤집기)
function react(g,act,side,instant){if(!cur||act==='look')return;{const st=stateFor(g,act);if(st!==undefined){const prev=STATES.get(g).now;stateSet(g,st,instant);return {swap:g,prev}}}const roots=groupRoots(g);if(!roots.length)return;const b=groupBox(g),c=b.getCenter(new THREE.Vector3());

// 상태 변형판(10/22 다른 세션 설계 → 10/23 반영) — compose 가 넣은 「물건__상태_<state>」 노드를 떼어 두었다가 반응할 때 바꿔 끼운다

// 반응을 그럴듯할 때만(10/23 미르: 바닥 불빛이 움직이고 쪽지가 나옴 · 문갑이 통째로 들려 위에 쪽지 → 부자연스럽다)

const SOFT=/이불|요$|이부자리|멍석|가마니|덮개|보자기|보|천|방석|돗자리|거적|짚|발$|휘장|포대|자루/;
const MOVABLE=/항아리|독|단지|동이|짚단|상$|소반|바구니|광주리|소쿠리|키$|체$|함$|궤$|목침|방석|등잔|화로|다듬잇돌|맷돌|절구|자루|가마니|채반|함지|병풍|발$|가리개/;/* 10/23: 병풍 밀기 */
const SMALL=/바가지|소반|그릇|사발|대접|책|패$|판$|목침|접시|종지|함지|키$|체$/;
function planReveal(g,c){const r=roleOf(g),act0=(c.reveal&&c.reveal.action)||'look';

function unreact(key){const m=MOVED.get(key);if(!m||m.restored)return;m.restored=true;const [r]=key.split('|');const piv=m.piv;if(piv&&piv.swap){if(STATES.get(piv.swap)?.now==='broken')return;/* 10/23: 깬 것은 되돌리지 않는다 */if(+r===ci)stateSet(piv.swap,piv.prev);return}if(+r!==ci||!piv||!piv.parent||!cur)return;tween(piv,{p:piv.userData.p0.clone(),q:new THREE.Quaternion()},600,()=>{if(!cur)return;cur.updateMatrixWorld(true);for(const ch of [...piv.children])cur.attach(ch);piv.parent&&piv.parent.remove(piv);buildBoxes()})}
// 단서 물건(절차 생성 — 서신·쪽지·열쇠·조각은 라이브러리 에셋 없이 코드로)
function paperTex(lines){const cv2=document.createElement('canvas');cv2.width=256;cv2.height=160;const x=cv2.getContext('2d');x.fillStyle='#efe4c8';x.fillRect(0,0,256,160);x.strokeStyle='#3a2c1e';x.lineWidth=2;for(let i=0;i<lines;i++){x.beginPath();const X=220-i*26;x.moveTo(X,18);for(let y=18;y<142;y+=9)x.lineTo(X+(Math.random()-.5)*4,y);x.stroke()}const t=new THREE.CanvasTexture(cv2);t.colorSpace=THREE.SRGBColorSpace;return t}
